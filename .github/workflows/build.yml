name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libsdl2-dev libglew-dev libglm-dev \
            xvfb mesa-utils libegl-mesa0 libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: GL info under xvfb
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo | \
            grep -E "direct rendering|OpenGL core profile version" || true

      - name: Smoke test (llvmpipe under xvfb, EGL)
        continue-on-error: true
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_X11_FORCE_EGL=1 \
            ./build/blackhole --frames 10 --anim --orbit 0 \
            --pixel 4 --polish --screenshot smoke.bmp

      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: smoke.bmp
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (vcpkg manifest mode)
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/shots | Out-Null
          Copy-Item build/Release/blackhole.exe pkg/
          Copy-Item build/vcpkg_installed/x64-windows/bin/*.dll pkg/
          Copy-Item README.md pkg/
          Copy-Item BUILD_WINDOWS.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath space-plus-plus-windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: space-plus-plus-windows-x64
          path: space-plus-plus-windows-x64.zip
