name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libsdl2-dev libglew-dev libglm-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      # No GL run here: runner software GL tops at 4.5, the app requires 4.6.
      # Runtime testing happens locally and on real GPUs (see BUILD_WINDOWS.md).

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (vcpkg manifest mode)
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/shots | Out-Null
          Copy-Item build/Release/blackhole.exe pkg/
          Copy-Item build/vcpkg_installed/x64-windows/bin/*.dll pkg/
          Copy-Item README.md pkg/
          Copy-Item BUILD_WINDOWS.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath space-plus-plus-windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: space-plus-plus-windows-x64
          path: space-plus-plus-windows-x64.zip
